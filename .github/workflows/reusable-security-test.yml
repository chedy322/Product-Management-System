# Run GitGuardian
# Run codeql for CVEs like sSQL INJECTION,XSS,etc...
# Run Snyk for packages vulnarbites 

name: Security test 
# TODO ADD THE BUILDONCE ARTIFACT finish from colpiloi in bar 
# ADD OTHER FILES ARCHITECTURE AND CREATE EVENT DRIVEN pipilens
on:
    workflow_call:
        inputs:
            LANGUAGE:
                type: string
                description: The language used during the development of the software
                default: java
            TARGET_ENV:
                type: string 
                required:  true
        secrets:
            GG_API_KEY:
                required: true 
            SNYK_TOKEN:
                required: true
                

env: 
    JAVA_VERSION: 25

jobs:
    gitGuardian:
        name: GitGuardian scan
        environment: ${{inputs.TARGET_ENV}}
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v3
                with:
                    fetch-depth: 0 
                    args: --all
            -   name: GitGuardian scan
                uses: GitGuardian/ggshield/actions/secret@v1.48.0
                env:
                    GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
                    GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
                    GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                    GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                    GITGUARDIAN_API_KEY: ${{ secrets.GG_API_KEY }}
    # SAST Tools like CodeQL IS used to detect vulnerabilities in the codebase.   
    CodeQl:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            actions: read
            contents: read
        steps:
            -   name: Checkout code repo 
                uses: actions/checkout@v4 
             
            -   uses: ./.github/actions/setup-java-cache.yml      
            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v3
                with:
                    languages: ${{ inputs.LANGUAGE }}
                    queries: security-extended
            
            -   name: Autobuild
                run: mvn package -DskipTests

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v3
                with:
                    upload: true
                    output: 'codeql-results'


    #  Snyk as SCA tool is used to detect vulnerabilities in the dependencies of the project.
    snyk: 
        runs-on: ubuntu-latest
        environment: ${{inputs.TARGET_ENV}}
        permissions:
            security-events: write
        steps:
            -   name: checkout code repo
                uses: actions/checkout@v4

            -   uses: ./.github/actions/setup-java-cache.yml  

            -   name: Compile and package project 
                run: mvn -B package -DskipTests
                
            -   name: Run Snyk test for dependencies
                uses: snyk/actions/maven@master
                continue-on-error: true
                env:
                    SNYK_TOKEN:  ${{ secrets.SNYK_TOKEN }}
                with:
                    args: --severity-threshold=high --sarif-file-output=snyk.sarif

                
            -   name: Upload snyk artifact result
                uses: github/codeql-action/upload-sarif@v3
                if: always()
                with:
                    sarif_file: snyk.sarif
            
            
            



    
